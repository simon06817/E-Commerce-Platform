spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  mq:
    enabled: true
  rabbitmq:
    order-exchange: e-commerce.order.exchange
    order-queue: e-commerce.order.queue
    order-routing-key: order.created
    order-paid-routing-key: order.paid
    order-dead-letter-exchange: e-commerce.order.dlx
    order-dead-letter-queue: e-commerce.order.dlq
    order-dead-letter-routing-key: order.dead
  order:
    expire-minutes: 30
    close-scan-interval-ms: 60000
    close-initial-delay-ms: 60000
  jwt:
    secret: ECommercePlatformJwtSecretKey2026ForInternshipProject
    access-expire-minutes: 15
    refresh-expire-days: 7
  upload:
    dir: target/testcontainers-uploads
    url-prefix: /uploads/
