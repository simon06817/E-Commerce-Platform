spring:
  application:
    name: E-Commerce-Platform
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/E-Commerce_Platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&connectionTimeZone=%2B08:00
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  cache:
    type: redis
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  type-enums-package: com.ecommerce.platform.common
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    login-limit-per-minute: 30
    login-window-ms: 60000
  mq:
    enabled: true
  rabbitmq:
    order-exchange: e-commerce.order.exchange
    order-queue: e-commerce.order.queue
    order-routing-key: order.created
    order-paid-routing-key: order.paid
    order-dead-letter-exchange: e-commerce.order.dlx
    order-dead-letter-queue: e-commerce.order.dlq
    order-dead-letter-routing-key: order.dead
  jwt:
    secret: ${JWT_SECRET}
    access-expire-minutes: 15
    refresh-expire-days: 7
  order:
    expire-minutes: 30
    close-scan-interval-ms: 60000
    close-initial-delay-ms: 60000
    auto-complete-hours: 24
    auto-complete-scan-interval-ms: 60000
    auto-complete-initial-delay-ms: 60000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    url-prefix: /uploads/

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-}] "
  level:
    root: info
    com.ecommerce.platform.mapper: warn
    org.mybatis: warn
    org.mybatis.spring: warn
    org.springframework.amqp: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
